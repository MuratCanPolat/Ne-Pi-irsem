<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Pişirsem?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
</head>

<body>
    <button id="viewSavedBtn"
        style="position: fixed; top: 20px; left: 20px; background: #ffbc58; color: #333; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 100;">📁
        Kayıtlı Tariflerim</button>

    <div id="savedRecipesModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative;">
            <button id="closeModalBtn"
                style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer;">❌</button>
            <h2 style="margin-top: 0; color: #ff6b6b; border-bottom: 2px solid #eee; padding-bottom: 10px;">📁 Kayıtlı
                Tariflerim</h2>

            <div id="savedRecipesList" style="text-align: left; margin-top: 15px;">
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🍳 Ne Pişirsem?</h1>
        <p>Elindeki malzemelerin fotoğrafını yükle, sana tarifler önereyim!</p>

        <!-- 1. AŞAMA: GİRDİLER -->
        <div class="upload-section">
            <h3 style="font-size: 16px; color: #555;">Seçenek 1: Fotoğraf Yükle 📷</h3>
            <input type="file" id="imageInput" accept="image/*">

            <h3 style="font-size: 16px; color: #555; margin-top: 15px;">Seçenek 2: Malzemeleri Yaz ✍️</h3>
            <input type="text" id="textInput" placeholder="Örn: 2 yumurta, yarım paket makarna, beyaz peynir...">

            <button id="analyzeBtn" style="margin-top: 20px; width: 100%;">Malzemeleri Analiz Et</button>
        </div>
        <div id="loading1" class="hidden loading" style="margin-top: 15px;">Şef malzemeleri inceliyor... 🧑‍🍳</div>

        <div id="suggestionsSection" class="hidden">
            <div id="suggestionsOutput"
                style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; text-align: left;">
            </div>
        </div>

        <div class="selection-section" style="display: none;">
            <div id="meal-selection-container"
                style="display: none; text-align: left; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px;">
            </div>
            <button id="recipeBtn"
                style="width: 100%; margin-bottom: 20px; background-color: #ff6b6b; color: white; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">Tarifi
                Getir 🍽️</button>
        </div>

        <div id="loading2" class="hidden loading" style="margin-top: 15px;">Tarif hazırlanıyor... 📝</div>

        <div id="recipeSection" class="hidden">
            <h2 style="color: #ff6b6b;">Tarif:</h2>
            <div id="recipeOutput"
                style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: left; margin-bottom: 15px;">
            </div>

            <button id="saveRecipeBtn"
                style="width: 100%; background-color: #4CAF50; color: white; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">Bu
                Tarifi Kaydet 💾</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
