<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Pişirsem?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>🍳 Ne Pişirsem?</h1>
        <p>Elindeki malzemelerin fotoğrafını yükle, sana tarifler önereyim!</p>

        <div class="upload-section">
            <h3 style="font-size: 16px; color: #555;">Seçenek 1: Fotoğraf Yükle 📷</h3>
            <input type="file" id="imageInput" accept="image/*">

            <h3 style="font-size: 16px; color: #555; margin-top: 15px;">Seçenek 2: Malzemeleri Yaz ✍️</h3>
            <input type="text" id="textInput" placeholder="Örn: 2 yumurta, yarım paket makarna, beyaz peynir...">

            <button id="analyzeBtn" style="margin-top: 20px; width: 100%;">Malzemeleri Analiz Et</button>
        </div>

        <div id="loading1" class="hidden loading">Şef malzemeleri inceliyor... 🧑‍🍳</div>

        <div id="suggestionsSection" class="hidden">
            <h2>Öneriler:</h2>
            <div id="suggestionsOutput"></div>

            <div class="selection-section">
                <input type="text" id="mealChoice" placeholder="Seçtiğin yemeğin adını yaz...">
                <button id="recipeBtn">Tarifi Getir</button>
            </div>
        </div>

        <div id="loading2" class="hidden loading">Tarif hazırlanıyor... 📝</div>

        <div id="recipeSection" class="hidden">
            <h2>Tarif:</h2>
            <div id="recipeOutput"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
